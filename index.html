<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="theme-color" content="#1d4733">

<title>Plano Interactivo El Cocuyo</title>

<style>
/* Layout: una hoja de plano enmarcada (mapa con zoom) junto a un panel de fichas; en teléfono el panel baja y se pliega. */
:root{
  --f-ui:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#e9e5da;--panel:#fdfbf7;--paper:#fdfbf7;--fg:#1c2433;--muted:#5d6678;--line:#cfc7b6;--soft:#f3eee2;
  --ground:#e3ecd9;--ground-line:#9db997;
  --lot:#f4e6c6;--lot-line:#9b8b6a;--lot-on:#ffd98a;--lot-hover:#fff2d2;--lot-ink:#5b5440;
  --road:#4b5568;--road-main:#2f3a4d;--path:#c9d3dc;--road-ink:#fff;
  --sant:#1d4733;--sant-dot:#3a7a58;--sant-ink:#e9fff1;
  --amber:#f6e7bd;--amber-line:#d9a441;--amber-ink:#7a520a;
  --gate:#9a6a12;--water:#14a3c7;--lamp:#f2c230;--lamp-edge:#6b5200;
  --sel:#0b6bcb;--sel-ink:#ffffff;--pill:#1c2433;--pill-ink:#ffffff;
  --ok:#1d6b3f;--warn:#a8650a;--bad:#a3262a;--doc:#1d5fa8;--calc:#8a5d0a;
  --shadow:0 1px 2px rgba(28,36,51,.12),0 4px 14px rgba(28,36,51,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117;--panel:#161c26;--paper:#121821;--fg:#e8e4da;--muted:#9aa3b2;--line:#2d3544;--soft:#1b2230;
  --ground:#1b2a22;--ground-line:#3b5a47;
  --lot:#3b3524;--lot-line:#8f8157;--lot-on:#6b5a22;--lot-hover:#4a4228;--lot-ink:#eadfbd;
  --road:#38425a;--road-main:#47536d;--path:#59667d;--road-ink:#fff;
  --sant:#1f6b48;--sant-dot:#49a679;--sant-ink:#eafff2;
  --amber:#4a3c18;--amber-line:#c9962f;--amber-ink:#f0cf86;
  --gate:#e0a93a;--water:#3fc1e3;--lamp:#f2c230;--lamp-edge:#000;
  --sel:#5aa9ff;--sel-ink:#07121f;--pill:#e8e4da;--pill-ink:#12171f;
  --ok:#5fd39a;--warn:#f0b455;--bad:#ff8a8d;--doc:#7fb6ff;--calc:#f0c06a;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117;--panel:#161c26;--paper:#121821;--fg:#e8e4da;--muted:#9aa3b2;--line:#2d3544;--soft:#1b2230;
  --ground:#1b2a22;--ground-line:#3b5a47;
  --lot:#3b3524;--lot-line:#8f8157;--lot-on:#6b5a22;--lot-hover:#4a4228;--lot-ink:#eadfbd;
  --road:#38425a;--road-main:#47536d;--path:#59667d;--road-ink:#fff;
  --sant:#1f6b48;--sant-dot:#49a679;--sant-ink:#eafff2;
  --amber:#4a3c18;--amber-line:#c9962f;--amber-ink:#f0cf86;
  --gate:#e0a93a;--water:#3fc1e3;--lamp:#f2c230;--lamp-edge:#000;
  --sel:#5aa9ff;--sel-ink:#07121f;--pill:#e8e4da;--pill-ink:#12171f;
  --ok:#5fd39a;--warn:#f0b455;--bad:#ff8a8d;--doc:#7fb6ff;--calc:#f0c06a;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;min-height:0}
.top{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:9px;flex:none}
.ttl{display:flex;flex-direction:column;min-width:0;flex:1}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
h1{margin:0;font-size:22px;line-height:1.05;font-weight:700;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.badge{flex:none;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:3px 10px}
.main{flex:1;min-height:0;display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 376px}
@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  h1{font-size:18px}.eyebrow{font-size:10px}.bw{display:none}.badge{font-size:10px;padding:3px 8px}
  .pill text{font-size:9.5px;letter-spacing:.04em}.t-vx{font-size:10px}
}
/* ---------- hoja del plano ---------- */
.sheet{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:6px;touch-action:none;min-height:0;cursor:grab;outline:none;box-shadow:var(--shadow)}
.sheet:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.sheet.drag{cursor:grabbing}.sheet.measuring{cursor:crosshair}
#geo,#lab{position:absolute;inset:0;width:100%;height:100%;display:block}
#lab{pointer-events:none}
#lab .hit{pointer-events:auto;cursor:pointer}
.ctl{position:absolute;z-index:3}
.zoom{right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.zoom button:hover{background:var(--soft)}
.zoom button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.zoom svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.north{left:12px;top:10px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:700;font-size:14px;color:var(--fg);pointer-events:none}
.north svg{width:14px;height:26px;fill:var(--fg)}
.scale{left:12px;bottom:10px;pointer-events:none;font-family:var(--f-mono);font-size:11px;color:var(--fg)}
.scale .bar{height:6px;border:1.5px solid var(--fg);border-top:0;margin-bottom:2px}
.readout{left:10px;bottom:38px;max-width:calc(100% - 64px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.readout{flex-wrap:nowrap;gap:8px}.readout span{white-space:nowrap}.readout b{font-family:var(--f-mono);font-size:15px}
@media (max-width:860px){.readout .dxy{display:none}}
.readout button{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px}
.lblhint{right:10px;bottom:10px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:2px 6px;border-radius:4px;pointer-events:none}

/* ---------- capas del dibujo ---------- */
.ground{fill:var(--ground)}
.amort{fill:url(#hAm);stroke:var(--amber-line);stroke-width:1px;vector-effect:non-scaling-stroke}
.sant{fill:url(#dSa);stroke:var(--sant);stroke-width:1px;vector-effect:non-scaling-stroke}
.road{vector-effect:non-scaling-stroke;stroke:none}
.r-c{fill:var(--road)}.r-a{fill:var(--path)}.r-m{fill:var(--road-main)}
.road.sel,.sant.sel,.amort.sel{stroke:var(--sel);stroke-width:3px}
.mk{fill:none;vector-effect:non-scaling-stroke;pointer-events:none}
.lot{fill:var(--lot);stroke:var(--lot-line);stroke-width:.9px;vector-effect:non-scaling-stroke;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.lot{transition:fill .15s,opacity .2s}}
@media (hover:hover){.lot:hover{fill:var(--lot-hover)}}
.mzf .lot{opacity:.3}.mzf .lot.on{opacity:1;fill:var(--lot-on)}
.lot.sel,.mzf .lot.sel{fill:var(--sel);stroke:var(--sel);stroke-width:2.5px;opacity:1}
.perim{fill:none;stroke:var(--fg);stroke-width:2.4px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.dot{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}
.bio{fill:none;stroke:var(--water);stroke-width:1.6px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}
.gt{vector-effect:non-scaling-stroke;pointer-events:none}
.selring{fill:none;stroke:var(--sel);stroke-width:3px;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}
/* ---------- rótulos (en píxeles, sobre el plano) ---------- */
.t{font-family:var(--f-mono);font-weight:600;paint-order:stroke;stroke-linejoin:round}
.t-halo{fill:var(--fg);stroke:var(--paper);stroke-width:3px}
.t-num{font-size:9px;fill:var(--lot-ink);font-weight:500}
.t-num.big{font-size:11px}
.t-num.sel{fill:var(--sel-ink);font-weight:600}
.t-road{font-family:var(--f-ui);font-size:9px;fill:var(--road-ink);stroke:var(--road);stroke-width:3px;letter-spacing:.14em;font-weight:700}
.t-road.m{stroke:var(--road-main)}.t-road.p{fill:var(--fg);stroke:var(--path)}
.t-vx{font-size:11px;fill:var(--fg);stroke:var(--paper);stroke-width:3.2px;font-weight:700}
.t-cota{font-size:9.5px;fill:var(--muted);stroke:var(--paper);stroke-width:3px;font-weight:500}
.t-sant{font-family:var(--f-ui);font-size:12px;letter-spacing:.2em;fill:var(--sant-ink);font-weight:700;stroke:var(--sant);stroke-width:3px}
.t-sant2{font-size:10px;fill:var(--sant-ink);stroke:var(--sant);stroke-width:3px;font-weight:500}
.t-amb{font-family:var(--f-ui);font-size:9.5px;letter-spacing:.12em;fill:var(--amber-ink);stroke:var(--amber);stroke-width:3px;font-weight:700}
.pill rect{fill:var(--pill);stroke:var(--paper);stroke-width:1.5px}
.pill text{font-family:var(--f-ui);font-size:10.5px;font-weight:700;letter-spacing:.07em;fill:var(--pill-ink);text-anchor:middle}
.pill.on rect{fill:var(--sel);}.pill.on text{fill:var(--sel-ink)}
.pill.gate rect{fill:var(--gate)}.pill.gate text{fill:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.gate text{fill:#1a1305}}
:root[data-theme="dark"] .pill.gate text{fill:#1a1305}
.mlab rect{fill:var(--sel)}.mlab text{fill:var(--sel-ink);font-family:var(--f-mono);font-size:12px;font-weight:600;text-anchor:middle}
/* ---------- panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;min-width:0;padding:11px 2px 10px;border:0;background:none;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.pane{overflow:auto;padding:14px 14px 18px;min-height:0;flex:1;overscroll-behavior:contain}
.pane[hidden]{display:none}
@media (max-width:860px){
  .panel{max-height:min(42vh,360px)}
  .panel[data-open="false"] .pane{display:none}
  .panel[data-open="false"] .tab[aria-selected="true"]{border-bottom-color:transparent;color:var(--muted)}
}
.h2{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fine{margin:10px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted);max-width:62ch}
.search{display:flex;gap:8px;margin-bottom:12px}
.search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--fg);padding:0 12px;font:500 16px var(--f-mono)}
.btn{height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font-weight:600;letter-spacing:.04em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.err{color:var(--bad);font-size:13px;margin:-6px 0 10px}
.card{display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-size:32px;line-height:1;font-weight:500;letter-spacing:-.02em}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;letter-spacing:.05em;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--muted);font-size:13.5px}
dd{margin:0;text-align:right;font-weight:500;min-width:0;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 6px}
.tag.doc{color:var(--doc)}.tag.calc{color:var(--calc)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wa{display:inline-flex;justify-content:center;align-items:center;height:44px;border-radius:8px;background:var(--sel);color:var(--sel-ink);text-decoration:none;font-weight:600;letter-spacing:.03em}
.empty{display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.stat b{display:block;font:500 20px/1.1 var(--f-mono);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.sw{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sw li{border-bottom:1px solid var(--line)}
.sw li:last-child{border-bottom:0}
.sw label{display:flex;align-items:center;gap:12px;min-height:46px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .k{width:26px;height:18px;flex:none;border-radius:3px}
.sw .nm{flex:1}
.sw .tg{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.sw .tg::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+.tg{background:var(--sel)}
.sw input:checked+.tg::after{transform:translateX(16px)}
.sw input:focus-visible+.tg{outline:2px solid var(--sel);outline-offset:2px}
.mzl{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:6px}
.mzr{width:100%;display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;text-align:left;cursor:pointer}
.mzr[aria-pressed="true"]{border-color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.mzr .n{font-weight:700;letter-spacing:.05em;font-size:14px}
.mzr .bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.mzr .bar i{display:block;height:100%;background:var(--fg);opacity:.75}
.mzr .c{font:500 12.5px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line);margin:4px 0 8px}
.stack i{display:block;height:100%}
.sup{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sup li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:baseline}
.sup .d{width:12px;height:12px;border-radius:3px;align-self:center}
.sup .v{font:500 13px var(--f-mono);text-align:right}
.sep{height:1px;background:var(--line);margin:14px 0}
.contact{display:flex;flex-direction:column;gap:6px}
.contact .who{font-weight:700;font-size:17px}
.contact .role{color:var(--calc);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.contact .tel{font:500 22px var(--f-mono);letter-spacing:.02em}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.tblw{overflow-x:auto;margin:0 -2px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--fg);font-weight:600;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:0 6px;text-align:right;border-bottom:1px solid var(--line);font:500 12.5px var(--f-mono);white-space:nowrap}
.tbl tr:nth-child(even) td{background:var(--soft)}
.rowbtn{border:0;background:none;padding:9px 0;min-height:36px;font:700 12.5px var(--f-mono);cursor:pointer;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.tbl tr.on td{background:color-mix(in srgb,var(--sel) 18%,transparent)}
.ck{font-weight:700}.ck-C{color:var(--ok)}.ck-D{color:var(--warn)}.ck-R{color:var(--bad)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
